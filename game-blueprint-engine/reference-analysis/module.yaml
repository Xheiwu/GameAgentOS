name: reference-analysis
version: 1.0
category: blueprint-engine
purpose: Extract reusable game design patterns from reference games.

input:
  - reference_games
  - desired_experience

output:
  - experience_patterns
  - system_patterns
  - module_requirements

rules:
  - Do not copy game content directly.
  - Extract underlying design principles.
  - Map patterns to existing agent modules.
