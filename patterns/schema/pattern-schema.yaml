# Pattern Schema v1.1

# Pattern is a design thinking guide, not a fixed implementation template.
# Agent should use patterns as inspiration and constraints, while keeping room for creative decisions.

pattern:
  id: unique_identifier
  name: pattern_name
  category:
    - combat
    - progression
    - economy
    - retention
    - content

core_experience:
  # What player experience does this pattern create?
  player_feeling: []
  motivation: []
  emotional_goal: []

why_it_works:
  # The underlying design reason.
  design_intention: []
  player_behavior_created: []

usage_context:
  # When this pattern is commonly useful.
  suitable_for: []
  reference_examples: []

related_modules:
  # Suggestions only. Agent decides final implementation.
  modules: []

considerations:
  # Risks and things Agent should think about.
  potential_problems: []
  balance_questions: []

agent_notes:
  creativity_level: high
  implementation_fixed: false
